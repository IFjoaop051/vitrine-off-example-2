{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sale</title>
    {% bootstrap_css %}
</head>
<body>
    <main class="container">
      <form
        action="{% url 'put_sale' %}"
        enctype="multipart/form-data"
        class="form"
        method="POST"
      >
        {% csrf_token %}
        {% bootstrap_form form %}

        <button type="submit">send it</button>
      </form>
    </main>
</body>
</html>
